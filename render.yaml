services:
  - type: web
    name: medihub-backend
    env: node
    rootDir: backend
    plan: starter
    # migrate deploy applies any pending prisma/migrations to the production DB
    # on every deploy (no-op when up to date), so schema changes ship themselves.
    buildCommand: npm install && npx prisma generate --schema prisma/schema.prisma && npx prisma migrate deploy --schema prisma/schema.prisma
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # OAuth 2.0 Web client ID from console.cloud.google.com — used to verify
      # Google ID tokens for "Continue with Google". Same value as the
      # frontend's NEXT_PUBLIC_GOOGLE_CLIENT_ID. Unset = Google sign-in off.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Public URL of the deployed frontend — used to build links in emails
      # (password reset, welcome). MUST be set or reset links point to localhost.
      - key: FRONTEND_URL
        sync: false
      # Gmail relay (Apps Script web app, backend/scripts/gmail-relay.gs):
      # free path to authenticated gmail.com inbox delivery over HTTPS.
      # URL is the deployed /exec URL; SECRET must match the script's constant.
      - key: GMAIL_RELAY_URL
        sync: false
      - key: GMAIL_RELAY_SECRET
        sync: false
      # gmail-relay first (inbox-grade delivery, ~100/day), smtp last —
      # Render cannot reach smtp.gmail.com (connection timeouts on 465/587),
      # so it is effectively a local-dev-only provider.
      - key: MAIL_PROVIDER_ORDER
        value: gmail-relay,smtp
      # Gmail SMTP is fixed config, not a secret — pin it here so the only
      # dashboard-managed values are the account (SMTP_USER/SMTP_FROM_EMAIL)
      # and the app password (SMTP_PASS). 465 = implicit TLS, reliable on Render.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: SMTP_FAMILY
        value: 4
      - key: SMTP_REQUIRE_TLS
        value: true
      - key: SMTP_DEBUG
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        value: Medzae
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      # Rolling alias that always points at Google's current stable Flash
      # model. Never pin a dated model here again — Google retires them
      # (gemini-1.5-* now 404s) and the assistant went down with it. The
      # backend also walks a fallback chain automatically if this model
      # ever disappears; see the `ai` block of GET /api/health for status.
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: EVENTBRITE_TOKEN
        sync: false
      - key: NEWS_API_KEY
        sync: false
      # Shared secret for POST /api/events/reminders/run, so an external
      # scheduler can drive the event-reminder sweep while the instance would
      # otherwise be idle. The in-process sweep (every 10 min) already covers
      # waking hours; this is only needed for reminders that must land
      # overnight. Unset = the endpoint 404s.
      - key: REMINDER_CRON_SECRET
        sync: false